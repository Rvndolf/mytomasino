{% extends 'dashboard_base.html' %}

{% block content %}
<div class="container-fluid d-flex justify-content-center align-items-start ticket-form-container">
  <div class="container ticket-detail-container delete-center">

    <form method="POST"
          hx-post="{% url 'tickets:delete_ticket' ticket.pk %}"
          hx-target="#dashboard-content"
          hx-swap="innerHTML">
      {% csrf_token %}

      <!-- Delete Confirmation Container (RED BORDER) -->
      <div class="card shadow-sm p-4 mb-3 delete-confirm-card">

        <h4 class="fw-bold mb-3 text-danger">
          <i class="fas fa-exclamation-triangle"></i> Confirm Delete
        </h4>

        <p class="mb-2">Are you sure you want to delete the ticket:</p>
        <h5 class="fw-bold">{{ ticket.title }}</h5>

        <p class="text-muted mt-2">
          This action <strong>cannot be undone</strong>.
        </p>

      </div>

      <!-- Action Buttons (VISUALLY OUTSIDE RED BORDER) -->
      <div class="action-buttons mb-4 d-flex justify-content-between">

        <button type="button"
                hx-get="{% url 'tickets:ticket_detail' ticket.pk %}"
                hx-target="#dashboard-content"
                hx-swap="innerHTML"
                class="btn btn-action btn-cancel">
          Cancel
        </button>

        <button type="submit"
                class="btn btn-action btn-delete">
          Yes, Delete
        </button>

      </div>

    </form>

  </div>
</div>

<style>
  /* Match Create / Update Ticket spacing */
  .ticket-form-container {
    min-height: 100vh;
    padding-top: 60px;
    padding-bottom: 60px;
  }

  /* Center container on desktop */
  .delete-center {
    margin-left: auto;
    margin-right: auto;
  }

  /* Red bordered delete confirmation card */
  .delete-confirm-card {
    border: 1px solid #dc3545;
    border-radius: 12px;
    background-color: #ffffff;
  }

  /* Faint black button borders */
  .btn-action {
    border: 1px solid rgba(0, 0, 0, 0.35);
    padding: 10px 20px;
    border-radius: 6px;
    transition: all 0.25s ease;
  }

  /* Cancel hover → gray */
  .btn-cancel:hover {
    background-color: #6c757d;
    border-color: #6c757d;
    color: white;
  }

  /* Delete hover → red */
  .btn-delete:hover {
    background-color: #dc3545;
    border-color: #dc3545;
    color: white;
  }
</style>
{% endblock %}
