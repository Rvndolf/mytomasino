{% extends "base.html" %}
{% block content %}

<style>
.success-icon {
  width: 80px;
  height: 80px;
  background-color: #144214;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1.5rem;
  animation: scaleIn 0.5s ease;
}

@keyframes scaleIn {
  from {
    transform: scale(0);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

.success-checkmark {
  color: white;
  font-size: 2.5rem;
}

.login-btn {
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.login-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(20, 66, 20, 0.3);
}
</style>

<div style="min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background-color: #f8f9fa;">
    <div class="text-center">
        <div class="success-icon">
            <span class="success-checkmark">✓</span>
        </div>
        
        <h3 class="mb-2" style="color: #144214; font-size: 1.5rem; font-weight: 600;">Password Changed!</h3>
        <p class="text-muted mb-4" style="font-size: 0.95rem;">Your password has been successfully updated.</p>
        
        <a href="{% url 'user:login' %}" 
           class="d-inline-block px-5 py-2 rounded-3 text-white login-btn" 
           style="background-color: #144214; text-decoration: none; font-size: 0.95rem;">
           Log In
        </a>
    </div>
</div>
{% endblock %}
