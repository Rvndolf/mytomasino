{% extends 'base.html' %}
{% block content %}

<!-- Bootstrap Icons -->
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  rel="stylesheet">

<div class="container-fluid">

  <div class="d-flex flex-column justify-content-center align-items-center vh-100 bg-light gap-4 login-wrapper">

  <!-- Welcome Text Container -->
  <div class="text-center">
    <h2 class="fw-bold text-success mb-0 welcome-text" style="font-family: Poppins; font-size: 2rem;background: linear-gradient(135deg, #144214 0%, #2d5a2d 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">Welcome, Thomasian!</h2>
  </div>
  
  <!-- Login Card -->
  <div class="card border-0 shadow-lg rounded-4 px-4 py-4"
      style="width: 100%; max-width: 420px; background-color: #ffffff;">

    <!-- Header -->
    <div class="text-center mb-4">
      <h5 class="fw-normal mb-0 login-header" style="font-size: 1rem; background: linear-gradient(180deg, #144214 0%, #2d5a2d 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">Log in here.</h5>
    </div>

      <!-- Hidden Barcode Login -->
      <form method="post" id="barcodeForm" style="position: absolute; left: -9999px;">
        {% csrf_token %}
        <input type="text" name="student_id" id="barcodeInput">
        <input type="hidden" name="barcode_login" value="1">
        <input type="hidden" name="remember_me" id="barcodeRememberMe" value="">
      </form>

      <!-- Login Form -->
      <form method="post" novalidate>
        {% csrf_token %}

        <!-- Email -->
        <div class="mb-2 input-wrapper">
          <input
            type="email"
            class="form-control rounded-3 text-center login-input"
            id="email"
            name="email"
            placeholder="yourname@ust-legazpi.edu.ph"
            required
          >
        </div>

        <!-- Password -->
        <div class="mb-3 position-relative input-wrapper">
          <input
            type="password"
            class="form-control rounded-3 text-center login-input pe-5"
            id="password"
            name="password"
            placeholder="Enter password"
            required
          >

          <!-- Reveal Button -->
          <button
            type="button"
            class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-2 text-muted password-toggle"
            aria-label="Toggle password visibility"
          >
            <i class="bi bi-eye-slash"></i>
          </button>
        </div>

        <!-- Remember Me -->
        <div class="mb-4 d-flex align-items-center gap-2 ps-1">
          <input
            type="checkbox"
            class="remember-checkbox"
            id="remember_me"
            name="remember_me"
            value="1"
          >
          <label for="remember_me" class="remember-label mb-0">Remember me</label>
        </div>

        <button type="submit"
                class="btn w-100 fw-semibold py-2 rounded-3 mb-2 login-btn"
                style="background-color: #144214; color: white;">
          Log In
        </button>

        <div class="text-start">
          <a href="{% url 'user:password_reset' %}"
            class="text-success fw-medium text-decoration-none forgot-link"
            style="font-size: 0.85rem; color: #144214;">
            Forgot your password?
          </a>
        </div>
      </form>

    </div>
</div>

<!-- Scripts -->
<script>
  /* ── Remembered email ── */
  document.addEventListener('DOMContentLoaded', function () {
    function getCookie(name) {
      const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      return match ? decodeURIComponent(match[2]).replace(/^"|"$/g, '') : null;
    }
    const rememberedEmail = getCookie('remembered_email');
    if (rememberedEmail) {
      document.getElementById('email').value = rememberedEmail;
      document.getElementById('remember_me').checked = true;
    }
  });

  /* ── Barcode scanner detection ──
     Scanners type very fast (chars arrive <50ms apart) then send Enter.
     We capture all keydown events at the document level, buffer them,
     and submit the hidden barcode form when Enter is detected.
  ── */
  (function () {
    const SCAN_MAX_INTERVAL_MS = 100; // relaxed to handle slower scanners
    const MIN_BARCODE_LENGTH   = 4;

    let buffer      = '';
    let lastKeyTime = 0;
    let scanTimer   = null;

    const barcodeForm       = document.getElementById('barcodeForm');
    const barcodeInput      = document.getElementById('barcodeInput');
    const barcodeRememberMe = document.getElementById('barcodeRememberMe');
    const rememberCheckbox  = document.getElementById('remember_me');

    function submitBarcode(value) {
      console.log('Submitting barcode:', value);
      barcodeInput.value = value;
      barcodeRememberMe.value = rememberCheckbox.checked ? '1' : '';
      barcodeForm.submit();
    }

    document.addEventListener('keydown', function (e) {
      const now = Date.now();
      const timeSinceLast = now - lastKeyTime;
      lastKeyTime = now;

      // On Enter — check if buffer has a valid barcode
      if (e.key === 'Enter') {
        console.log('Enter detected, buffer:', buffer);
        if (buffer.length >= MIN_BARCODE_LENGTH) {
          e.preventDefault();
          clearTimeout(scanTimer);
          submitBarcode(buffer);
        }
        buffer = '';
        return;
      }

      // Ignore non-printable keys
      if (e.key.length !== 1) return;

      // If chars arrive fast enough, it's a scanner — keep buffering
      // If it's been a while, reset (user started typing manually)
      if (timeSinceLast > SCAN_MAX_INTERVAL_MS && buffer.length > 0) {
        // Only reset if the active element is a manual input field
        const tag = document.activeElement.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA') {
          buffer = '';
        }
      }

      buffer += e.key;
      console.log('Buffer:', buffer);

      // Safety net: if scanner doesn't send Enter, auto-submit after pause
      clearTimeout(scanTimer);
      scanTimer = setTimeout(function () {
        if (buffer.length >= MIN_BARCODE_LENGTH) {
          submitBarcode(buffer);
        }
        buffer = '';
      }, 300);
    });
  })();

  /* ── Password toggle ── */
  const toggleBtn     = document.querySelector('.password-toggle');
  const passwordInput = document.getElementById('password');
  const icon          = toggleBtn.querySelector('i');

  toggleBtn.addEventListener('click', () => {
    const isHidden = passwordInput.type === 'password';
    passwordInput.type = isHidden ? 'text' : 'password';
    icon.classList.add('icon-animate');
    setTimeout(() => {
      icon.classList.toggle('bi-eye-slash', !isHidden);
      icon.classList.toggle('bi-eye', isHidden);
      icon.classList.remove('icon-animate');
    }, 150);
  });

  /* ── Loading state on manual login ── */
  const loginForm = document.querySelector('form:not(#barcodeForm)');
  const loginBtn  = document.querySelector('.login-btn');

  loginForm.addEventListener('submit', function () {
    loginBtn.disabled = true;
    loginBtn.innerHTML = `
      <span style="font-family:inherit;font-weight:inherit;">Logging in...</span>
      <span class="spinner-border spinner-border-sm ms-2" role="status" aria-hidden="true"></span>
    `;
  });

  document.addEventListener('DOMContentLoaded', function () {
    const hasErrors = document.querySelectorAll('.toast .bg-danger, .toast.bg-danger').length > 0;
    if (hasErrors) {
      loginBtn.disabled = false;
      loginBtn.innerHTML = 'Log In';
    }
  });
</script>

<style>
/* Inputs */
.login-input {
  height: 48px;
  font-size: 0.95rem;
  border: none;
}

.login-input::placeholder {
  text-align: center;
  color: hsl(140, 17%, 37%);
  opacity: 1;
}

/* Input container shadow */
.input-wrapper {
  border-radius: 0.75rem;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
  transition: box-shadow 0.2s ease, transform 0.2s ease;
}

.input-wrapper:focus-within {
  box-shadow: 0 8px 22px rgba(25, 135, 84, 0.25);
  transform: translateY(-1px);
}

/* Eye button */
.password-toggle {
  border: none;
  background: transparent;
}

.password-toggle i {
  font-size: 1.1rem;
  transition: color 0.2s ease;
}

.password-toggle:hover i {
  color: #198754;
}

/* Icon click animation */
.icon-animate {
  transform: scale(0.8) rotate(-10deg);
  opacity: 0.6;
  transition: transform 0.15s ease, opacity 0.15s ease;
}

/* Remember Me */
.remember-checkbox {
  width: 16px;
  height: 16px;
  accent-color: #144214;
  cursor: pointer;
  flex-shrink: 0;
}

.remember-label {
  font-size: 0.85rem;
  color: hsl(140, 17%, 37%);
  cursor: pointer;
  user-select: none;
}

/* Mobile responsive text sizing */
@media (max-width: 576px) {
  .login-wrapper {
    justify-content: flex-start !important;
    padding-top: 10vh;
  }

  .welcome-text {
    font-size: 1.5rem !important;
    margin-bottom: 0 !important;
  }
  
  .login-header {
    font-size: 0.875rem !important;
  }
  
  .login-input {
    height: 44px;
    font-size: 0.875rem;
  }
  
  .login-input::placeholder {
    font-size: 0.8rem;
  }
  
  .login-btn {
    font-size: 0.9rem;
    padding: 0.5rem !important;
  }
  
  .forgot-link {
    font-size: 0.75rem !important;
  }

  .remember-label {
    font-size: 0.75rem;
  }
  
  .footer-text {
    font-size: 0.7rem;
  }
}
</style>

{% endblock %}
