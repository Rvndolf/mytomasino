{% extends 'base.html' %}
{% block content %}

<!-- Bootstrap Icons -->
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  rel="stylesheet">

<div class="container-fluid">

  <div class="d-flex flex-column justify-content-center align-items-center vh-100 bg-light gap-4 login-wrapper">

  <!-- Welcome Text Container -->
  <div class="text-center">
    <h2 class="fw-bold text-success mb-0 welcome-text" style="font-family: Poppins; font-size: 2rem;background: linear-gradient(135deg, #144214 0%, #2d5a2d 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">Welcome, Thomasian!</h2>
  </div>
  
  <!-- Login Card -->
  <div class="card border-0 shadow-lg rounded-4 px-4 py-4"
      style="width: 100%; max-width: 420px; background-color: #ffffff;">

    <!-- Header -->
    <div class="text-center mb-4">
      <h5 class="fw-normal mb-0 login-header" style="font-size: 1rem; background: linear-gradient(180deg, #144214 0%, #2d5a2d 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">Log in here.</h5>
    </div>

      <!-- Hidden Barcode Login -->
      <form method="post" id="barcodeForm" style="position: absolute; left: -9999px;">
        {% csrf_token %}
        <input type="text" name="student_id" id="barcodeInput" autofocus>
        <input type="hidden" name="barcode_login" value="1">
        <input type="hidden" name="remember_me" id="barcodeRememberMe" value="">
      </form>

      <!-- Login Form -->
      <form method="post" novalidate>
        {% csrf_token %}

        <!-- Email -->
        <div class="mb-2 input-wrapper">
          <input
            type="email"
            class="form-control rounded-3 text-center login-input"
            id="email"
            name="email"
            placeholder="yourname@ust-legazpi.edu.ph"
            required
          >
        </div>

        <!-- Password -->
        <div class="mb-3 position-relative input-wrapper">
          <input
            type="password"
            class="form-control rounded-3 text-center login-input pe-5"
            id="password"
            name="password"
            placeholder="Enter password"
            required
          >

          <!-- Reveal Button -->
          <button
            type="button"
            class="btn btn-sm position-absolute top-50 end-0 translate-middle-y me-2 text-muted password-toggle"
            aria-label="Toggle password visibility"
          >
            <i class="bi bi-eye-slash"></i>
          </button>
        </div>

        <!-- Remember Me -->
        <div class="mb-4 d-flex align-items-center gap-2 ps-1">
          <input
            type="checkbox"
            class="remember-checkbox"
            id="remember_me"
            name="remember_me"
            value="1"
          >
          <label for="remember_me" class="remember-label mb-0">Remember me</label>
        </div>

        <button type="submit"
                class="btn w-100 fw-semibold py-2 rounded-3 mb-2 login-btn"
                style="background-color: #144214; color: white;">
          Log In
        </button>

        <div class="text-start">
          <a href="{% url 'user:password_reset' %}"
            class="text-success fw-medium text-decoration-none forgot-link"
            style="font-size: 0.85rem; color: #144214;">
            Forgot your password?
          </a>
        </div>
      </form>



    </div>
</div>

<!-- Toast Container (positioned absolutely, outside card) -->
<div class="position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 9999;">
  {% if messages %}
    {% for message in messages %}
      <div class="toast show align-items-center border-0 shadow-sm 
                  {% if message.tags == 'success' %}bg-success
                  {% else %}bg-danger{% endif %} text-white" 
           role="alert" 
           aria-live="assertive" 
           aria-atomic="true"
           style="min-width: 280px; max-width: 350px;">
        <div class="d-flex">
          <div class="toast-body text-center w-100 py-2">
            {{ message }}
          </div>
          <button type="button" 
                  class="btn-close btn-close-white me-2 my-auto" 
                  data-bs-dismiss="toast" 
                  aria-label="Close"></button>
        </div>
      </div>
    {% endfor %}
  {% endif %}
</div>

<!-- Scripts -->
<script>
  /* Barcode focus logic */
  let typingTimer;
  const barcodeInput = document.getElementById('barcodeInput');
  const barcodeForm = document.getElementById('barcodeForm');
  const barcodeRememberMe = document.getElementById('barcodeRememberMe');
  const rememberCheckbox = document.getElementById('remember_me');

  barcodeInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      // Sync the remember me value to barcode form before submitting
      barcodeRememberMe.value = rememberCheckbox.checked ? '1' : '';
      barcodeForm.submit();
    }
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('form:not(#barcodeForm)')) {
      barcodeInput.focus();
    }
  });

  document.addEventListener('keyup', function() {
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => {
      barcodeInput.focus();
    }, 2000);
  });

  /* Password toggle with reversed icons */
  const toggleBtn = document.querySelector('.password-toggle');
  const passwordInput = document.getElementById('password');
  const icon = toggleBtn.querySelector('i');

  toggleBtn.addEventListener('click', () => {
    const isHidden = passwordInput.type === 'password';

    passwordInput.type = isHidden ? 'text' : 'password';

    icon.classList.add('icon-animate');

    setTimeout(() => {
      icon.classList.toggle('bi-eye-slash', !isHidden);
      icon.classList.toggle('bi-eye', isHidden);
      icon.classList.remove('icon-animate');
    }, 150);
  });

  /* Auto-hide toast after 4 seconds */
  document.addEventListener('DOMContentLoaded', function() {
    const toasts = document.querySelectorAll('.toast');
    toasts.forEach(toast => {
      setTimeout(() => {
        const bsToast = bootstrap.Toast.getOrCreateInstance(toast);
        bsToast.hide();
      }, 4000);
    });
  });
</script>

<style>
/* Inputs */
.login-input {
  height: 48px;
  font-size: 0.95rem;
  border: none;
}

.login-input::placeholder {
  text-align: center;
  color: hsl(140, 17%, 37%);
  opacity: 1;
}

/* Input container shadow */
.input-wrapper {
  border-radius: 0.75rem;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
  transition: box-shadow 0.2s ease, transform 0.2s ease;
}

.input-wrapper:focus-within {
  box-shadow: 0 8px 22px rgba(25, 135, 84, 0.25);
  transform: translateY(-1px);
}

/* Eye button */
.password-toggle {
  border: none;
  background: transparent;
}

.password-toggle i {
  font-size: 1.1rem;
  transition: color 0.2s ease;
}

.password-toggle:hover i {
  color: #198754;
}

/* Icon click animation */
.icon-animate {
  transform: scale(0.8) rotate(-10deg);
  opacity: 0.6;
  transition: transform 0.15s ease, opacity 0.15s ease;
}

/* Remember Me */
.remember-checkbox {
  width: 16px;
  height: 16px;
  accent-color: #144214;
  cursor: pointer;
  flex-shrink: 0;
}

.remember-label {
  font-size: 0.85rem;
  color: hsl(140, 17%, 37%);
  cursor: pointer;
  user-select: none;
}

/* Toast styling */
.toast {
  animation: slideDown 0.3s ease-out;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Mobile responsive text sizing */
@media (max-width: 576px) {
  .login-wrapper {
    justify-content: flex-start !important;
    padding-top: 10vh;
  }

  .welcome-text {
    font-size: 1.5rem !important;
    margin-bottom: 0 !important;
  }
  
  .login-header {
    font-size: 0.875rem !important;
  }
  
  .login-input {
    height: 44px;
    font-size: 0.875rem;
  }
  
  .login-input::placeholder {
    font-size: 0.8rem;
  }
  
  .login-btn {
    font-size: 0.9rem;
    padding: 0.5rem !important;
  }
  
  .forgot-link {
    font-size: 0.75rem !important;
  }

  .remember-label {
    font-size: 0.75rem;
  }

  .remember-label {
    font-size: 0.78rem;
  }
  
  .footer-text {
    font-size: 0.7rem;
  }
}
</style>

{% endblock %}
