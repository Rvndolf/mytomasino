{% extends 'base.html' %}
{% block content %}

<style>
.back-to-login {
  transition: opacity 0.2s ease;
}

.back-to-login:hover {
  opacity: 0.7;
}

.btn {
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(20, 66, 20, 0.3);
}

.form-control:focus {
  border-color: #144214;
  box-shadow: 0 0 0 0.2rem rgba(20, 66, 20, 0.15);
}
</style>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
  <div class="card shadow-lg border-0" style="max-width: 450px; width: 100%;">
    <h2 class="text-center text-white p-3 rounded-top mb-0" style="background-color: #144214; font-size: 1.5rem; font-weight: 600;">Password Reset</h2>
    <div class="card-body p-4">
      <p class="text-center text-muted mb-4" style="font-size: 0.9rem;">Enter your registered email to receive a reset link.</p>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label for="email" class="form-label" style="font-size: 0.9rem;">Email address</label>
          <input type="email" class="form-control rounded-3" name="email" required style="padding: 0.6rem;">
        </div>
        <button type="submit" class="btn w-100 py-2 rounded-3" style="background-color: #144214; color: white; font-size: 0.95rem;">Send Reset Link</button>
      </form>
        <div class="text-center mt-3">
        <a href="{% url 'user:login' %}" class="text-decoration-none back-to-login" style="color: #144214; font-size: 0.85rem;">Back to Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
