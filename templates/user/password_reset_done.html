{% extends 'base.html' %}
{% block content %}

<style>
.back-to-login-btn {
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.back-to-login-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(20, 66, 20, 0.3);
}
</style>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-lg border-0 p-4 text-center" style="max-width: 500px;">
    <h2 class="mb-3" style="color: #144214; font-size: 1.5rem; font-weight: 600;">Check Your Email</h2>
    <p style="font-size: 0.95rem; color: #6c757d;">
      If an account with that email exists, we've sent a password reset link.
      Please check your inbox (and spam folder).
    </p>
    <a href="{% url 'user:login' %}" class="btn mt-3 back-to-login-btn rounded-3 py-2" style="background-color: #144214; color: white; font-size: 0.95rem;">Back to Login</a>
  </div>
</div>
{% endblock %}
