<div id="delete-ticket-{{ ticket.pk }}" class="p-4">
  <h5 class="mb-3 fw-bold" style="font-size: 1rem;">Delete Ticket - {{ ticket.ticket_id }}: {{ ticket.title }}</h5>
  <p class="mb-4 text-muted" style="font-size: 0.875rem;">Are you sure you want to permanently delete this ticket?</p>
  <form method="post"
        hx-post="{% url 'admin_panel:delete_ticket' ticket.pk %}"
        hx-trigger="submit"
        hx-target="this"
        hx-swap="none"
        hx-on::after-request="
          htmx.ajax('GET', '{% url 'admin_panel:ticket_list' %}?status={{ status_filter|default_if_none:'' }}{% for cat in active_categories %}&categories={{ cat }}{% endfor %}', {target: '#ticket-table-body', swap: 'innerHTML'}); 
          document.getElementById('ticket-detail-container').innerHTML='<div class=\'card shadow-sm border-0\' style=\'border-radius: 15px; height: 600px;\'><div class=\'card-body text-center d-flex flex-column align-items-center justify-content-center h-100\'><i class=\'fas fa-ticket-alt fa-3x text-muted mb-3\'></i><h5 class=\'text-muted\'>Select a ticket to view details</h5></div></div>';
        ">
    {% csrf_token %}
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-delete-confirm">
        Yes, Delete
      </button>
      <button type="button" 
              class="btn btn-cancel-confirm"
              hx-get="{% url 'admin_panel:ticket_detail' ticket.pk %}"
              hx-target="#ticket-detail-container"
              hx-swap="innerHTML">
        Cancel
      </button>
    </div>
  </form>
</div>

<style>
  /* Delete confirmation button */
  .btn-delete-confirm {
    background-color: transparent !important;
    color: #333 !important;
    border: 1px solid rgba(0, 0, 0, 0.15) !important;
    border-radius: 15px !important;
    font-size: 0.875rem;
    padding: 0.5rem 1rem;
    transition: all 0.2s ease;
  }

  .btn-delete-confirm:hover {
    background-color: #dc3545 !important;
    color: white !important;
    border-color: #dc3545 !important;
    transform: translateY(-1px);
    box-shadow: 0 2px 4px rgba(220, 53, 69, 0.2);
  }

  /* Cancel button */
  .btn-cancel-confirm {
    background-color: transparent !important;
    color: #333 !important;
    border: 1px solid rgba(0, 0, 0, 0.15) !important;
    border-radius: 15px !important;
    font-size: 0.875rem;
    padding: 0.5rem 1rem;
    transition: all 0.2s ease;
  }

  .btn-cancel-confirm:hover {
    background-color: #6c757d !important;
    color: white !important;
    border-color: #6c757d !important;
    transform: translateY(-1px);
    box-shadow: 0 2px 4px rgba(108, 117, 125, 0.2);
  }
</style>
