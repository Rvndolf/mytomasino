<div id="update-ticket-{{ ticket.pk }}" class="p-4">
  <h5 class="mb-3 fw-bold" style="font-size: 1rem;">Update Ticket - {{ ticket.ticket_id }}: {{ ticket.title }}</h5>
  
  <div class="mb-3">
    <p class="mb-2" style="font-size: 0.875rem;"><strong>Category:</strong> {{ ticket.get_category_display }}</p>
    <p class="mb-2" style="font-size: 0.875rem;"><strong>Created By:</strong> {{ ticket.created_by.get_full_name|default:ticket.created_by.username }}</p>
    <p class="mb-3" style="font-size: 0.875rem;"><strong>Current Status:</strong> {{ ticket.get_status_display }}</p>
  </div>

  <form method="post"
        hx-post="{% url 'admin_panel:update_ticket' ticket.pk %}"
        hx-trigger="submit"
        hx-target="#ticket-detail-container"
        hx-swap="innerHTML"
        hx-on::before-request="startUpdateLoading()"
        hx-on::after-request="stopUpdateLoading()">
    {% csrf_token %}
    <div class="mb-3">
      <label for="status-{{ ticket.pk }}" class="form-label fw-semibold" style="font-size: 0.875rem;">Select New Status</label>
      <select name="status" id="status-{{ ticket.pk }}" class="form-select" required style="font-size: 0.875rem;">
        {% for key, value in ticket.STATUS_CHOICES %}
        <option value="{{ key }}" {% if ticket.status == key %}selected{% endif %}>{{ value }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="d-flex gap-2 align-items-center">
      <button type="submit" class="btn btn-update-confirm" id="update-btn-{{ ticket.pk }}">
        <span class="btn-label">Update Status</span>
        <span class="btn-spinner d-none">
          <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
          Updating...
        </span>
      </button>
      <button type="button" 
              class="btn btn-cancel-confirm"
              hx-get="{% url 'admin_panel:ticket_detail' ticket.pk %}"
              hx-target="#ticket-detail-container"
              hx-swap="innerHTML">
        Cancel
      </button>
    </div>
  </form>
</div>

<script>
  function startUpdateLoading() {
    const btn = document.querySelector('#update-btn-{{ ticket.pk }}');
    if (!btn) return;
    // Capture selected status label before the swap destroys the DOM
    const select = document.querySelector('#status-{{ ticket.pk }}');
    if (select) {
      window._pendingStatusLabel = select.selectedOptions[0]?.text || null;
    }
    btn.disabled = true;
    btn.querySelector('.btn-label').classList.add('d-none');
    btn.querySelector('.btn-spinner').classList.remove('d-none');
  }

  function stopUpdateLoading() {
    const btn = document.querySelector('#update-btn-{{ ticket.pk }}');
    if (!btn) return;
    btn.disabled = false;
    btn.querySelector('.btn-label').classList.remove('d-none');
    btn.querySelector('.btn-spinner').classList.add('d-none');
  }

  // Listen for successful update and show toast
  document.body.addEventListener('htmx:afterRequest', function handler(event) {
    if (event.detail.successful &&
        event.detail.requestConfig.path.includes('update-ticket')) {
      const label = window._pendingStatusLabel;
      const message = label
        ? `Ticket status updated to "<strong>${label}</strong>"`
        : 'Ticket updated successfully!';
      showToastNotification(message);
      window._pendingStatusLabel = null;
      document.body.removeEventListener('htmx:afterRequest', handler);
    }
  });
</script>

<style>
  .btn-update-confirm {
    background-color: transparent !important;
    color: #333 !important;
    border: 1px solid rgba(0, 0, 0, 0.15) !important;
    border-radius: 15px !important;
    font-size: 0.875rem;
    padding: 0.5rem 1rem;
    transition: all 0.2s ease;
  }

  .btn-update-confirm:hover:not(:disabled) {
    background-color: #198754 !important;
    color: white !important;
    border-color: #198754 !important;
    transform: translateY(-1px);
    box-shadow: 0 2px 4px rgba(25, 135, 84, 0.2);
  }

  .btn-update-confirm:disabled {
    opacity: 0.75;
    cursor: not-allowed;
  }

  .btn-cancel-confirm {
    background-color: transparent !important;
    color: #333 !important;
    border: 1px solid rgba(0, 0, 0, 0.15) !important;
    border-radius: 15px !important;
    font-size: 0.875rem;
    padding: 0.5rem 1rem;
    transition: all 0.2s ease;
  }

  .btn-cancel-confirm:hover {
    background-color: #6c757d !important;
    color: white !important;
    border-color: #6c757d !important;
    transform: translateY(-1px);
    box-shadow: 0 2px 4px rgba(108, 117, 125, 0.2);
  }
</style>
